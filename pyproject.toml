[project]
name = "vexiq-sim"
version = "0.1.0"
description = "2D simulator for VEX IQ Python programs on the Level Up field"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vex", "vexsim"]
py-modules = ["urandom"]
